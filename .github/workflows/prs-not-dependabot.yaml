name: Test PRs

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    # Dependabot-PR-er testes av dependabot-test.yaml, som trigges av push til
    # dependabot/**-grener. Uten denne sjekken ville begge workflowene kjørt de
    # samme testene på hver Dependabot-PR. Filtrering i `on:` er ikke mulig,
    # fordi `branches` for pull_request gjelder målgrenen (main), ikke kildegrenen.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: yarn

      - run: yarn --immutable
      - run: yarn lint:ci
      - run: yarn workspace @navikt/texas build
      - run: yarn test
      - run: yarn build
