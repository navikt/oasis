name: Deploy test-app

on:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: yarn

      - run: yarn --immutable
      - run: yarn lint:ci
      - run: yarn workspace @navikt/texas build
      - run: yarn test

  build:
    name: Build and Publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0 # ratchet:nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: oasis-maintainers
          tag: ${{ github.sha }}

    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}

  deploy-azure:
    name: Deploy with Azure AD
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: azure-gcp
      url: https://oasis-azure.intern.dev.nav.no
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/nais-azure.yaml
          PRINT_PAYLOAD: true
          VAR: image=${{ needs.build.outputs.image }}

  deploy-idporten:
    name: Deploy with IDporten
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: idporten-gcp
      url: https://oasis-idporten.intern.dev.nav.no

    permissions:
      id-token: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: .nais/nais-idporten.yaml
          PRINT_PAYLOAD: true
          VAR: image=${{ needs.build.outputs.image }}
