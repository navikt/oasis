name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Hvilken del av versjonen skal økes"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bestem versjon
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: "read"
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_BUMP: ${{ inputs.bump }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Godta kun tagger på formen vX.Y.Z som utgangspunkt. Dette hindrer at
          # et spesiallaget taggnavn havner i $(( )) nedenfor, der bash ellers
          # evaluerer array-subskript og kan kjøre vilkårlige kommandoer.
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1 || true)

          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
            PREVIOUS_TAG=$(git tag -l 'v*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -Fxv "$TAG" | head -n 1 || true)
          elif [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Uventet trigger: $EVENT_NAME" >&2
            exit 1
          else
            # Taggen settes på commiten workflowen kjører fra. Uten denne
            # sjekken ville en release startet fra en annen gren gitt en tagg
            # som peker utenfor main.
            if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "Release må kjøres fra ${DEFAULT_BRANCH}, ikke ${REF_NAME}" >&2
              exit 1
            fi

            BASE="${LATEST_TAG#v}"
            BASE="${BASE:-0.0.0}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE%%-*}"
            case "$INPUT_BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
              *) echo "Ukjent bump: $INPUT_BUMP" >&2; exit 1 ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            TAG="v${VERSION}"
            PREVIOUS_TAG="$LATEST_TAG"
          fi

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Ugyldig versjon: $VERSION (forventer x.y.z)" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" != "push" ] && git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} finnes allerede" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"
          echo "Slipper ${TAG} (forrige: ${PREVIOUS_TAG:-ingen})" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verifiser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: version
    permissions:
      contents: "read"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: yarn --immutable
      - run: yarn lint:ci
      - run: yarn build:lib && yarn test

  publish:
    name: Publiser til GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [version, verify]
    permissions:
      contents: "read"
      packages: "write"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false

      - run: yarn --immutable

      - name: Sett versjon i arbeidskopien før build (OTEL leser lib-versjonen)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: yarn workspaces foreach --no-private -At version -i "$VERSION"

      - run: yarn build:lib

      - name: Publish @navikt/texas first
        run: yarn npm publish
        working-directory: libs/texas
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @navikt/oasis with new @navikt/texas as dependency
        run: yarn npm publish
        working-directory: libs/oasis
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Tagg og opprett release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version, publish]
    permissions:
      contents: "write"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - name: Create tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${GH_REPO}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${SHA}" > /dev/null
          echo "Tagget ${SHA} som ${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          ARGS=(--title "$TAG" --generate-notes --verify-tag)
          if [ -n "$PREVIOUS_TAG" ]; then
            ARGS+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "$TAG" "${ARGS[@]}"
          echo "Release opprettet: $TAG" >> "$GITHUB_STEP_SUMMARY"
