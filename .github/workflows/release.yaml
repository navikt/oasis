name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Hvilken del av versjonen skal økes"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bestem versjon
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: "read"
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          # Godta kun tagger på formen vX.Y.Z som utgangspunkt. Dette hindrer at
          # et spesiallaget taggnavn havner i $(( )) nedenfor, der bash ellers
          # evaluerer array-subskript og kan kjøre vilkårlige kommandoer.
          LATEST_TAG=$(git tag -l 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1 || true)

          if [ "$EVENT_NAME" = "push" ]; then
            TAG="$REF_NAME"
            VERSION="${TAG#v}"
            PREVIOUS_TAG=$(git tag -l 'v*' --sort=-v:refname \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -Fxv "$TAG" | head -n 1 || true)
          elif [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "Uventet trigger: $EVENT_NAME" >&2
            exit 1
          else
            BASE="${LATEST_TAG#v}"
            BASE="${BASE:-0.0.0}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE%%-*}"
            case "$INPUT_BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
              *) echo "Ukjent bump: $INPUT_BUMP" >&2; exit 1 ;;
            esac
            VERSION="${MAJOR}.${MINOR}.${PATCH}"
            TAG="v${VERSION}"
            PREVIOUS_TAG="$LATEST_TAG"
          fi

          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Ugyldig versjon: $VERSION (forventer x.y.z)" >&2
            exit 1
          fi

          if [ "$EVENT_NAME" != "push" ] && git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} finnes allerede" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"
          echo "Slipper ${TAG} (forrige: ${PREVIOUS_TAG:-ingen})" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verifiser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: version
    permissions:
      contents: "read"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - run: yarn --immutable
      - run: yarn lint:ci
      - run: yarn build:lib && yarn test

  publish:
    name: Publiser til GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [version, verify]
    permissions:
      contents: "read"
      packages: "write"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # ratchet:actions/setup-node@v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          package-manager-cache: false

      - run: yarn --immutable

      - name: Bump version before build, because OTEL uses the lib version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: yarn workspaces foreach --no-private -At version -i "$VERSION"

      - run: yarn build:lib

      - name: Publish @navikt/texas first
        run: yarn npm publish
        working-directory: libs/texas
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @navikt/oasis with new @navikt/texas as dependency
        run: yarn npm publish
        working-directory: libs/oasis
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Commit versjon, tagg og opprett release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version, publish]
    permissions:
      contents: "write"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # ratchet:step-security/harden-runner@v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Commit version bump to default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          for pkg in libs/texas libs/oasis; do
            jq --arg v "$VERSION" '.version = $v' "$pkg/package.json" > "$pkg/package.tmp.json"
            mv "$pkg/package.tmp.json" "$pkg/package.json"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- libs/texas/package.json libs/oasis/package.json; then
            echo "package.json er allerede på ${VERSION}, ingen commit nødvendig"
          else
            git add libs/texas/package.json libs/oasis/package.json
            git commit -m "chore(release): ${TAG}"

            # Pakkene er allerede publisert på dette tidspunktet. Har main
            # beveget seg imens, rebaser og prøv igjen framfor å la releasen
            # feile med publiserte pakker uten tagg.
            for attempt in 1 2 3; do
              if git -c credential.helper= \
                     -c credential.helper='!f(){ echo username=x-access-token; echo "password=${GH_TOKEN}"; };f' \
                     push origin "HEAD:${BRANCH}"; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "Klarte ikke pushe versjonsbump etter 3 forsøk" >&2
                exit 1
              fi
              echo "Push avvist, rebaser mot ${BRANCH} (forsøk ${attempt})"
              git -c credential.helper= \
                  -c credential.helper='!f(){ echo username=x-access-token; echo "password=${GH_TOKEN}"; };f' \
                  fetch origin "${BRANCH}"
              git rebase "origin/${BRANCH}"
            done

            echo "Versjon ${VERSION} committet til ${BRANCH}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -a "$TAG" -m "$TAG"
          git -c credential.helper= \
              -c credential.helper='!f(){ echo username=x-access-token; echo "password=${GH_TOKEN}"; };f' \
              push origin "refs/tags/${TAG}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          ARGS=(--title "$TAG" --generate-notes --verify-tag)
          if [ -n "$PREVIOUS_TAG" ]; then
            ARGS+=(--notes-start-tag "$PREVIOUS_TAG")
          fi
          gh release create "$TAG" "${ARGS[@]}"
          echo "Release opprettet: $TAG" >> "$GITHUB_STEP_SUMMARY"
